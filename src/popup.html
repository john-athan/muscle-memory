<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Muscle Memory</title>
  <link rel="stylesheet" href="options.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <div class="pop-head">
    <div>
      <strong>Conventional keymap</strong>
      <small id="state"></small>
    </div>
    <label class="switch">
      <input type="checkbox" id="keymap-enabled" aria-label="Conventional keymap">
      <span class="slider" aria-hidden="true"></span>
    </label>
  </div>

  <div class="ledger" id="ledger"></div>

  <div class="pop-foot">
    <button type="button" id="open-options" class="linkish">All settings</button>
  </div>

  <script src="keymap.js"></script>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
