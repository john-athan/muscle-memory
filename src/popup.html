<!doctype html>
<html lang="en">
<head>

  <title>Muscle Memory</title>

  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <div class="pop-head">
    <strong>Muscle Memory</strong>

  <script src="keymap.js"></script>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
