name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs rather than tags. A tag is
# mutable and `@stable` is a branch, so whoever controls that repository would
# otherwise choose what runs in this one. Dependabot bumps SHA pins the same
# way it bumps tags, so this costs nothing to maintain.
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Every file the extension loads, checked against what is on disk.
      # A path renamed in src/ but not in the manifest, or a stylesheet the
      # options page links and nobody ships, fails silently at load time and
      # is the one break a user cannot diagnose. The earlier version of this
      # step checked the content scripts only, which is how the CSS and the
      # popup's script list went unguarded.
      - name: Every referenced file exists
        run: node scripts/check-assets.mjs

      - name: Syntax-check every script
        run: |
          for f in src/*.js test/*.test.js scripts/*.mjs; do
            node --check "$f" || exit 1
          done

      - name: Test
        run: npm test

      # Builds the store package and checks it against the store's own limits,
      # so a rejection is found here rather than after a multi-day review.
      - name: The package really contains what it claims
        run: npm run package

  icons:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/icons
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from tools/icons/rust-toolchain.toml, which is pinned so
      # that a codegen change cannot move a pixel and fail this job on an
      # unrelated pull request.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Icons in the tree match what the generator produces
        # The PNGs are committed so that loading the extension needs no
        # toolchain. That is only safe if they cannot drift from the source.
        # --locked so the check is against pinned dependencies, and
        # `git status` rather than `git diff` so a newly added size shows up
        # as an untracked file instead of passing unnoticed.
        run: |
          cargo run --locked --release
          cd "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain -- icons)" ]; then
            echo "The generator's output no longer matches the committed icons."
            echo "If this followed a dependency or toolchain bump, regenerate,"
            echo "check the icons still look right, and commit them."
            git status --porcelain -- icons
            exit 1
          fi
