name: CI

# A caller, never a container: each job runs one part of tools/validate.sh,
# the same script that runs on the machine before a push.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs rather than tags. A tag is
# mutable and `@stable` is a branch, so whoever controls that repository would
# otherwise choose what runs in this one.
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Validate
        run: tools/validate.sh extension

  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version itself comes from tools/icons/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Validate
        run: tools/validate.sh icons
