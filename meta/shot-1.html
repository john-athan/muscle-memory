<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
body{width:1280px;height:800px;display:flex;flex-direction:column;justify-content:center;padding:0 96px;gap:0}
.wordmark{font-size:40px;margin-bottom:52px}
.hero{display:flex;align-items:center;gap:64px}
.cap-hero{font-size:86px;padding:.5em .58em .42em;border-radius:24px;
 box-shadow:0 9px 0 var(--cap-side),0 13px 0 var(--cap-edge),0 26px 46px rgba(16,20,30,.18)}
h1{font-size:44px;letter-spacing:-.03em;line-height:1.1;font-weight:700;margin-bottom:16px}
p{font-size:21px;color:var(--soft);line-height:1.45;max-width:26ch}
.claims{display:flex;gap:40px;margin-top:34px}
</style></head><body>
  <div class="wordmark">Muscle Memory</div>
  <div class="hero">
    <div><span class="cap cap-hero">&#8679;&#8984;R</span>
      <div class="claims">
        <div class="claimant lost"><b>Figma takes it</b><span>Paste to Replace</span></div>
        <div class="claimant won"><b>You meant</b><span>Hard reload</span></div>
      </div>
    </div>
    <div>
      <h1>One key,<br>two claimants.</h1>
      <p>Press it meaning hard reload, with a slide selected, and Figma swaps that slide for your clipboard.</p>
    </div>
  </div>
</body></html>
